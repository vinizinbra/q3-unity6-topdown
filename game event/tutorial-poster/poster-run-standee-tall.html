<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rift Jumpers Run Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* A4 sheet with one standee piece centred on it: a 120x140mm portrait panel plus a blank
     100x20mm tab underneath that slides into the origami standee's slot. A grey hairline marks the cut. */
  @page { size: 210mm 297mm; margin: 0; }
  :root {
    --pink: #FD3971;
    --magenta: #E3218C;
    --cyan: #2FC3F0;
    --ink: #111014;
    --slate: #403D52;
    /* Whole CSS px so Chrome's print layout doesn't floor fractional sizes (e.g. 100mm = 377.95px -> 377px) */
    --w: 454px;      /* panel 120.12mm */
    --h: 530px;      /* panel 140.23mm */
    --tab-w: 378px;  /* slot tab 100.01mm */
    --tab-h: 76px;   /* slot tab 20.11mm */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 210mm; height: 297mm; background: #fff; }
  body {
    font-family: "Barlow Semi Condensed", sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet { position: relative; width: 210mm; height: 297mm; display: flex; align-items: center; justify-content: center; }

  .piece { position: relative; display: flex; flex-direction: column; align-items: center; }
  .poster { position: relative; width: var(--w); height: var(--h); background: #fff; overflow: hidden; display: flex; flex-direction: column; flex: none; }

  /* Hidden inside the standee slot: decoration only, never information */
  .tab {
    width: var(--tab-w); height: var(--tab-h); flex: none; background: var(--ink);
    background-image: repeating-linear-gradient(-45deg, transparent 0 3mm, rgba(253,57,113,0.18) 3mm 4.2mm);
  }

  .cutline { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; z-index: 10; }
  /* The part of the hero art past the panel's right edge (Pixie), drawn outside the clipped panel */
  .group.escaped { position: absolute; z-index: 5; display: block; }

  .shards { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .content { position: relative; z-index: 1; padding: 4.4mm 5mm 4.6mm; flex: 1; display: flex; flex-direction: column; }

  /* Header */
  header { text-align: center; }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 2.6mm; }
  .title {
    font-family: "Anton", sans-serif; font-size: 9mm; line-height: 1; text-transform: uppercase; letter-spacing: 0.1mm;
  }
  .title .hot { color: var(--pink); }
  .time {
    font-family: "Anton", sans-serif; font-size: 4.4mm; line-height: 1; background: var(--ink); color: #fff;
    padding: 1mm 2.2mm 0.9mm; transform: skewX(-10deg);
  }
  .time span { display: inline-block; transform: skewX(10deg); }

  /* Steps: Survive + Break (heroes in a left gutter), then Explore across the full width */
  .steps { display: flex; flex-direction: column; gap: 2.8mm; margin-top: 4.4mm; flex: 1; }
  .loop { display: flex; flex-direction: column; gap: 2.8mm; }
  .loop .step { display: flex; flex-direction: column; justify-content: center; }
  .loop .step ul, .loop .step p { align-self: flex-start; }
  .step {
    position: relative; background: rgba(255,255,255,0.94); border: 0.7mm solid var(--ink);
    border-radius: 5.5mm 0 5.5mm 0; corner-shape: bevel; padding: 2.2mm 3.4mm 2.6mm;
  }
  /* Full-figure cutouts: feet on the box floor, head popping out over the top edge */
  .step .art { position: absolute; z-index: 2; bottom: 0.6mm; height: 30mm; width: auto; filter: drop-shadow(0.5mm 0.5mm 0 rgba(17,16,20,0.25)); }
  .step > *:not(.art) { position: relative; z-index: 1; }
  .step-title { display: flex; align-items: center; gap: 2mm; margin-bottom: 1.2mm; }
  .step-num {
    font-family: "Anton", sans-serif; font-size: 6mm; color: #fff; background: var(--pink);
    width: 9.4mm; height: 8.2mm; padding-top: 0.4mm; flex: none;
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  }
  .step.break .step-num { background: var(--cyan); }
  .step-name { font-family: "Anton", sans-serif; font-size: 7.8mm; line-height: 1; letter-spacing: 0.2mm; }
  .dur {
    font-family: "Anton", sans-serif; font-size: 4.2mm; line-height: 1; color: #fff; background: var(--ink);
    padding: 1mm 2mm 0.9mm; transform: skewX(-10deg); margin-left: 0.6mm; white-space: nowrap;
  }
  .dur span { display: inline-block; transform: skewX(10deg); }
  .step p, .step li { font-size: 4.4mm; line-height: 1.18; font-weight: 600; }
  .step p + p, .step p + ul { margin-top: 1.4mm; }
  .step b { font-weight: 800; }
  .term { font-weight: 800; color: var(--magenta); }
  .step ul { list-style: none; }
  .step li { padding-left: 4.4mm; position: relative; margin-top: 0.8mm; }
  .step li::before {
    content: ""; position: absolute; left: 0.2mm; top: 1.2mm; width: 2.5mm; height: 3mm;
    background: var(--pink); clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%);
  }
  .narrow { max-width: 62mm; }

  /* One big group illustration (Brute, Max, Pixie) overlapping the right edge of the Survive/Break cards.
     The cards stop 44mm short of the right edge and keep a right padding so the art never covers text.
     Drawn twice: a full copy BEHIND the cards and a copy IN FRONT with its lower-left corner masked out,
     so Max's guns sit on top of the cards while his legs tuck behind the Break card. A geometric rift
     covers the art's straight bottom cut, so the heroes climb out of a tear instead of just ending.
     (No transform / z-index on the wrappers: the two copies must stack against the cards directly.) */
  .loop-row { position: relative; display: flex; flex: none; }
  .loop-row .loop { flex: none; width: calc(100% - 44mm); }
  .loop-row .loop .step { padding-right: 12mm; z-index: 1; background: #fff; }
  .group {
    display: block; width: 100%;
  }
  .group-wrap { position: absolute; right: -11mm; top: -8mm; bottom: -1mm; width: 64mm; display: flex; align-items: flex-end; }
  .group-stack { position: relative; width: 100%; }
  /* Cut Max off at the pelvis (85% height, just under the belt), left 78% of the art only so Pixie's foot stays
     whole; the rift sits on that cut */
  .group { clip-path: polygon(0 0, 100% 0, 100% 100%, 78% 100%, 78% 85%, 0 85%); }
  .group.back { position: absolute; left: 0; top: 0; z-index: 0; }
  .rift { position: absolute; z-index: 3; left: 16.5%; width: 66%; bottom: calc(15% - 5mm); overflow: visible; }
  /* Hide the 21.5% x 23% bottom-left corner (the strip over the cards, below the gun hand) */
  .group.front {
    position: relative; z-index: 2;
    -webkit-mask-image: linear-gradient(#000, #000), linear-gradient(#000, #000);
    -webkit-mask-size: 100% 100%, 21.5% 23%;
    -webkit-mask-position: 0 0, 0 100%;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-composite: xor;
            mask-image: linear-gradient(#000, #000), linear-gradient(#000, #000);
            mask-size: 100% 100%, 21.5% 23%;
            mask-position: 0 0, 0 100%;
            mask-repeat: no-repeat;
            mask-composite: exclude;
  }
  .loop .narrow { max-width: none; }

  /* Explore: the dark highlighted card, boss rising from its floor */
  .step.explore {
    background: var(--ink); color: #fff; border: 0.9mm solid var(--pink);
    box-shadow: 1.8mm 1.8mm 0 var(--cyan); overflow: visible; margin: 0 1.8mm 1.8mm 0;
    flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center;
  }
  /* Explore is the hero card of the portrait: bigger title, text and boss */
  .explore .step-name { font-size: 10mm; }
  .explore .step-num { width: 11mm; height: 9.6mm; font-size: 6mm; }
  .explore p { font-size: 5mm; line-height: 1.2; }
  /* Boss art is landscape with a faded base: let it rise out of the card's floor, corner-out */
  .explore .art { right: -12mm; bottom: -2mm; height: 51mm; filter: none; }
  .explore .step-title, .explore p { z-index: 3; }
  .explore p { max-width: 50mm; }
  .step.explore { min-height: 34mm; }
  .explore .step-title { margin-bottom: 0; }
  .explore .term { color: #FF8FB0; }
  .explore .step-num { font-size: 5mm; padding-top: 0; }
  .explore p { margin-top: 2mm; }

</style>
</head>
<body>
<div class="sheet">
  <div class="piece">
    <div class="poster">
      <svg class="shards" viewBox="0 0 120 150" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,0 22,0 6,16 0,11" fill="#FD3971"/>
        <polygon points="0,18 9,14 0,30" fill="#2FC3F0"/>
        <polygon points="13,0 29,0 17,8" fill="#2FC3F0" opacity="0.85"/>
        <polygon points="120,0 98,0 114,16 120,11" fill="#FD3971"/>
        <polygon points="120,18 111,14 120,30" fill="#2FC3F0"/>
        <polygon points="107,0 91,0 103,8" fill="#2FC3F0" opacity="0.85"/>
      </svg>

      <div class="content">
        <header>
          <div class="title-row">
            <div class="title">How a <span class="hot">run</span> works</div>
            <div class="time"><span>~15 MIN</span></div>
          </div>
        </header>

        <div class="steps">
          <div class="loop-row">
          <div class="loop">
            <article class="step survive">
              <div class="step-title"><div class="step-num">1</div><div class="step-name">SURVIVE</div><div class="dur"><span>3 MIN</span></div></div>
              <p class="narrow">Kill enemies, collect <span class="term">XP</span>.</p>
              <p class="narrow">Level up = <b>pick an upgrade</b>.</p>
            </article>

            <article class="step break">
              <div class="step-title"><div class="step-num">2</div><div class="step-name">BREAK</div><div class="dur"><span>1 MIN</span></div></div>
              <p class="narrow">Clear the area, spend <span class="term">Coins</span>:</p>
              <ul class="narrow">
                <li><span class="term">Store</span>: Health, Weapons</li>
                <li><span class="term">Gunsmith</span>: Weapon perks</li>
              </ul>
            </article>
          </div>
          <div class="group-wrap"><div class="group-stack">
            <img class="group back" src="img/heroes_group.png" alt="" aria-hidden="true">
            <img class="group front" src="img/heroes_group.png" alt="Brute, Max and Pixie">
            <svg class="rift" viewBox="0 0 100 24" aria-hidden="true">
              <polygon points="0,13 4,9 6,11 13,-1 15,10 22,7 24,11 26,8.5 31,10.5 38,0 40,10 47,6 49,11 52,9 58,11 64,-3 67,10 71,8 74,11 80,3 83,10.5 86,9 90,11 96,5 98,10 100,12 98,14 93,19 89,15 84,16 79,23 74,15 68,17 61,15 56,21 50,16 43,18 36,15 31,22 25,16 18,17 12,15 7,19 3,15" fill="#2FC3F0" transform="translate(2 1.4)"/>
              <polygon points="0,13 4,9 6,11 13,-1 15,10 22,7 24,11 26,8.5 31,10.5 38,0 40,10 47,6 49,11 52,9 58,11 64,-3 67,10 71,8 74,11 80,3 83,10.5 86,9 90,11 96,5 98,10 100,12 98,14 93,19 89,15 84,16 79,23 74,15 68,17 61,15 56,21 50,16 43,18 36,15 31,22 25,16 18,17 12,15 7,19 3,15" fill="#FD3971"/>
              <polygon points="8,3 11,-4 12,5" fill="#2FC3F0"/>
              <polygon points="1,7 2.5,3 5,7.5" fill="#FD3971"/>
              <polygon points="33,1 35,-6 36.5,2" fill="#FD3971"/>
              <polygon points="44,3 47,-2 46,4" fill="#2FC3F0"/>
              <polygon points="75,4 78,-1 77.5,5" fill="#2FC3F0"/>
              <polygon points="92,2 98,-3 96,4" fill="#FD3971"/>
              <polygon points="27,22 33,26 25,26.5" fill="#2FC3F0"/>
              <polygon points="62,22 66,27 59,26" fill="#FD3971"/>
              <polygon points="84,21 89,24 85,26" fill="#2FC3F0"/>
            </svg>
          </div></div>
          </div>

          <article class="step explore">
            <img class="art" src="img/World1Boss_fade.png" alt="">
            <div class="step-title"><div class="step-num">★</div><div class="step-name">EXPLORE</div></div>
            <p>Find <span class="term">Chests</span> and <span class="term">Challenges</span> for rare rewards.</p>
          </article>
        </div>
      </div>

    </div>

    <div class="tab" aria-hidden="true"></div>

    <!-- Cut path: built at load time so it can follow Pixie where she steps out of the panel -->
    <svg class="cutline" id="cutline" aria-hidden="true"><path fill="none" stroke="#9A97A6" stroke-width="0.8"/></svg>
  </div>
</div>
<script>
  // Pixie steps out of the panel's right edge: copy the hero art outside the (clipped) panel, then cut around her.
  // ENVELOPE = rightmost silhouette x (fraction of art width) at every hundredth of the art's height.
  const ENVELOPE = [0.4395, 0.4527, 0.465, 0.693, 0.7012, 0.7235, 0.7284, 0.7333, 0.7374, 0.7391, 0.7391, 0.7391, 0.7391, 0.7391, 0.7391, 0.7391, 0.7391, 0.7613, 0.7712, 0.7794, 0.7885, 0.7967, 0.8, 0.8, 0.8872, 0.9062, 0.9235, 0.9391, 0.9449, 0.9481, 0.9523, 0.9556, 0.9597, 0.9638, 0.9679, 0.972, 0.9761, 0.9794, 0.9811, 0.9811, 0.9811, 0.9811, 0.9926, 0.9959, 0.9959, 0.9959, 0.9959, 0.9959, 0.9984, 0.9984, 0.9984, 0.9984, 0.9984, 0.9992, 0.9992, 0.9992, 0.9992, 0.9984, 0.9967, 0.9967, 0.9975, 0.9975, 0.9975, 0.9975, 0.9975, 0.9975, 0.9975, 0.9975, 0.9959, 0.9926, 0.9901, 0.986, 0.9802, 0.9737, 0.9646, 0.9473, 0.9366, 0.9481, 0.9588, 0.9679, 0.977, 0.9794, 0.9819, 0.9835, 0.9844, 0.9844, 0.9844, 0.9844, 0.9844, 0.9835, 0.9819, 0.9794, 0.977, 0.9745, 0.9712, 0.9687, 0.777, 0.777, 0.777, 0.777, 0.777];
  window.addEventListener('load', () => {
    const piece = document.querySelector('.piece'), poster = document.querySelector('.poster');
    const art = document.querySelector('.group.front'), tab = document.querySelector('.tab');
    const P = piece.getBoundingClientRect(), Q = poster.getBoundingClientRect(), A = art.getBoundingClientRect(), T = tab.getBoundingClientRect();
    const edge = Q.right - P.left, mm = 96 / 25.4, pad = 0.6 * mm;

    const out = art.cloneNode();
    out.className = 'group escaped';
    out.alt = '';
    out.style.left = (A.left - P.left) + 'px';
    out.style.top = (A.top - P.top) + 'px';
    out.style.width = A.width + 'px';
    out.style.clipPath = `inset(0 0 0 ${Q.right - A.left}px)`;
    piece.appendChild(out);

    const H = Q.height, tl = T.left - P.left, tr = T.right - P.left, tb = T.bottom - P.top;
    const pts = [[0, 0], [edge, 0]];
    const bulge = [];
    ENVELOPE.forEach((fx, i) => {
      if (fx < 0) return;
      const x = A.left - P.left + fx * A.width + pad, y = A.top - P.top + (i / 100) * A.height;
      if (x > edge && y > 0 && y < H) bulge.push([x, y]);
    });
    if (bulge.length) pts.push([edge, bulge[0][1] - 0.8 * mm], ...bulge, [edge, bulge[bulge.length - 1][1] + 0.8 * mm]);
    pts.push([edge, H], [tr, H], [tr, tb], [tl, tb], [tl, H], [0, H]);
    document.querySelector('#cutline path').setAttribute('d', 'M' + pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') + 'Z');
  });
</script>
</body>
</html>
