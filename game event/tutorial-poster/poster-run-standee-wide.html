<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rift Jumpers Run Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* A4 sheet with one standee piece centred on it: a 170x95mm landscape panel plus a blank
     100x20mm tab underneath that slides into the origami standee's slot. A grey hairline marks the cut. */
  @page { size: 210mm 297mm; margin: 0; }
  :root {
    --pink: #FD3971;
    --magenta: #E3218C;
    --cyan: #2FC3F0;
    --ink: #111014;
    --slate: #403D52;
    /* Whole CSS px so Chrome's print layout doesn't floor fractional sizes (e.g. 100mm = 377.95px -> 377px) */
    --w: 642px;      /* panel 169.86mm */
    --h: 360px;      /* panel 95.25mm */
    --tab-w: 378px;  /* slot tab 100.01mm */
    --tab-h: 76px;   /* slot tab 20.11mm */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 210mm; height: 297mm; background: #fff; }
  body {
    font-family: "Barlow Semi Condensed", sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet { position: relative; width: 210mm; height: 297mm; display: flex; align-items: center; justify-content: center; }

  .piece { position: relative; display: flex; flex-direction: column; align-items: center; }
  .poster { position: relative; width: var(--w); height: var(--h); background: #fff; overflow: hidden; display: flex; flex-direction: column; flex: none; }

  /* Hidden inside the standee slot: decoration only, never information */
  .tab {
    width: var(--tab-w); height: var(--tab-h); flex: none; background: var(--ink);
    background-image: repeating-linear-gradient(-45deg, transparent 0 3mm, rgba(253,57,113,0.18) 3mm 4.2mm);
  }

  .cutline { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 10; }

  .shards { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .content { position: relative; z-index: 1; padding: 4.4mm 5mm 4.6mm; flex: 1; display: flex; flex-direction: column; }

  /* Header */
  header { text-align: center; }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 2.6mm; }
  .title {
    font-family: "Anton", sans-serif; font-size: 9mm; line-height: 1; text-transform: uppercase; letter-spacing: 0.1mm;
  }
  .title .hot { color: var(--pink); }
  .time {
    font-family: "Anton", sans-serif; font-size: 4.4mm; line-height: 1; background: var(--ink); color: #fff;
    padding: 1mm 2.2mm 0.9mm; transform: skewX(-10deg);
  }
  .time span { display: inline-block; transform: skewX(10deg); }

  /* Steps: Survive + Break stacked on the left, Explore as a tall card on the right */
  .steps { display: grid; grid-template-columns: 1fr 54mm; gap: 3.6mm; margin-top: 4.4mm; flex: 1; }
  .loop { display: flex; flex-direction: column; gap: 2.8mm; }
  .loop .step { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
  .loop .step ul, .loop .step p { align-self: flex-start; }
  .step {
    position: relative; background: rgba(255,255,255,0.94); border: 0.7mm solid var(--ink);
    border-radius: 5.5mm 0 5.5mm 0; corner-shape: bevel; padding: 2.2mm 3.4mm 2.6mm;
  }
  /* Full-figure cutouts: feet on the box floor, head popping out over the top edge */
  .step .art { position: absolute; z-index: 2; bottom: 0.6mm; height: 30mm; width: auto; filter: drop-shadow(0.5mm 0.5mm 0 rgba(17,16,20,0.25)); }
  .step > *:not(.art) { position: relative; z-index: 1; }
  .step-title { display: flex; align-items: center; gap: 2mm; margin-bottom: 1.2mm; }
  .step-num {
    font-family: "Anton", sans-serif; font-size: 6mm; color: #fff; background: var(--pink);
    width: 9.4mm; height: 8.2mm; padding-top: 0.4mm; flex: none;
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  }
  .step.break .step-num { background: var(--cyan); }
  .step-name { font-family: "Anton", sans-serif; font-size: 8.4mm; line-height: 1; letter-spacing: 0.2mm; }
  .dur {
    font-family: "Anton", sans-serif; font-size: 4.2mm; line-height: 1; color: #fff; background: var(--ink);
    padding: 1mm 2mm 0.9mm; transform: skewX(-10deg); margin-left: 0.6mm;
  }
  .dur span { display: inline-block; transform: skewX(10deg); }
  .step p, .step li { font-size: 4.6mm; line-height: 1.18; font-weight: 600; }
  .step p + p, .step p + ul { margin-top: 1.4mm; }
  .step b { font-weight: 800; }
  .term { font-weight: 800; color: var(--magenta); }
  .step ul { list-style: none; }
  .step li { padding-left: 4.4mm; position: relative; margin-top: 0.8mm; }
  .step li::before {
    content: ""; position: absolute; left: 0.2mm; top: 1.2mm; width: 2.5mm; height: 3mm;
    background: var(--pink); clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%);
  }
  .narrow { max-width: 62mm; }

  /* Heroes stand OUTSIDE their card, in a shared left gutter, feet level with the card floor */
  .loop .step { margin-left: 38mm; }
  .loop .narrow { max-width: none; }
  .survive .art { left: -35mm; bottom: 0; height: 33mm; }
  /* Break shows two heroes: Brute behind, Pixie overlapping in front */
  .break .art.brute { left: -26mm; bottom: 0; height: 31mm; }
  .break .art.pixie { left: -39.5mm; bottom: 0; height: 29mm; z-index: 3; }

  /* Explore: the dark highlighted card, boss rising from its floor */
  .step.explore {
    background: var(--ink); color: #fff; border: 0.9mm solid var(--pink);
    box-shadow: 1.8mm 1.8mm 0 var(--cyan); overflow: visible; margin: 0 1.8mm 1.8mm 0;
    padding-top: 3.2mm;
  }
  .explore .art { left: 50%; transform: translateX(-50%); bottom: -1.2mm; height: 36mm; filter: none; }
  .explore .step-title { margin-bottom: 0; }
  .explore .term { color: #FF8FB0; }
  .explore .step-num { font-size: 5mm; padding-top: 0; }
  .explore p { margin-top: 2mm; }

</style>
</head>
<body>
<div class="sheet">
  <div class="piece">
    <div class="poster">
      <svg class="shards" viewBox="0 0 170 120" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,0 22,0 6,16 0,11" fill="#FD3971"/>
        <polygon points="0,18 9,14 0,30" fill="#2FC3F0"/>
        <polygon points="13,0 29,0 17,8" fill="#2FC3F0" opacity="0.85"/>
        <polygon points="170,0 148,0 164,16 170,11" fill="#FD3971"/>
        <polygon points="170,18 161,14 170,30" fill="#2FC3F0"/>
        <polygon points="157,0 141,0 153,8" fill="#2FC3F0" opacity="0.85"/>
      </svg>

      <div class="content">
        <header>
          <div class="title-row">
            <div class="title">How a <span class="hot">run</span> works</div>
            <div class="time"><span>~15 MIN</span></div>
          </div>
        </header>

        <div class="steps">
          <div class="loop">
            <article class="step survive">
              <img class="art" src="img/max_cut.png" alt="">
              <div class="step-title"><div class="step-num">1</div><div class="step-name">SURVIVE</div><div class="dur"><span>3 MIN</span></div></div>
              <p class="narrow">Kill enemies, collect <span class="term">XP</span>.</p>
              <p class="narrow">Level up = <b>pick an upgrade</b>.</p>
            </article>

            <article class="step break">
              <img class="art brute" src="img/brute_cut.png" alt="">
              <img class="art pixie" src="img/pixie_cut.png" alt="">
              <div class="step-title"><div class="step-num">2</div><div class="step-name">BREAK</div><div class="dur"><span>1 MIN</span></div></div>
              <p class="narrow">Clear the area, spend <span class="term">Coins</span>:</p>
              <ul class="narrow">
                <li><span class="term">Store</span>: Health, Weapons, Accessory</li>
                <li><span class="term">Gunsmith</span>: Weapon perks</li>
              </ul>
            </article>
          </div>

          <article class="step explore">
            <img class="art" src="img/World1Boss_fade.png" alt="">
            <div class="step-title"><div class="step-num">★</div><div class="step-name">EXPLORE</div></div>
            <p>Find <span class="term">Chests</span> and <span class="term">Challenges</span> for rare rewards.</p>
          </article>
        </div>
      </div>

    </div>

    <div class="tab" aria-hidden="true"></div>

    <!-- Cut path around panel + tab, in CSS px (panel 642x360, tab 378x76 centred at x=132) -->
    <svg class="cutline" width="642" height="436" viewBox="0 0 642 436" aria-hidden="true">
      <path d="M0 0H642V360H510V436H132V360H0Z" fill="none" stroke="#9A97A6" stroke-width="0.8"/>
    </svg>
  </div>
</div>
</body>
</html>
