<!doctype html>

<title>Rift Jumpers Feedback Strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* A4 sheet with three copies of the standee's feedback footer, to cut out and glue onto the standee.
     Trim size is EXACTLY 110mm wide (the crop marks); 10mm of black bleed runs past every trim edge so a
     slightly-off cut still lands on black, never white. */
  @page { size: 210mm 297mm; margin: 0; }
  :root { --pink: #FD3971; --ink: #111014; --w: 110mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 210mm; height: 297mm; background: #fff; }
  body { font-family: "Barlow Semi Condensed", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { position: relative; width: 210mm; height: 297mm; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30mm; }
  .bleed { position: relative; flex: none; width: 130mm; height: 46mm; padding: 10mm; }
  /* Black bleed + crop marks drawn as vector in mm user units (trim box x 10..120, y 10..36), so the trim
     lines sit exactly 110mm apart instead of being pixel-snapped HTML boxes */
  .bleed > svg { position: absolute; left: 0; top: 0; width: 130mm; height: 46mm; overflow: visible; }

  .strip {
    position: relative; z-index: 1; width: var(--w); height: 26mm; flex: none; color: #fff;
    padding: 3.2mm 4mm; display: flex; align-items: center; gap: 3.6mm;
  }
  /* Feedback QR: white tile keeps a quiet zone around the code on the dark band */
  .qr-tile { flex: none; background: #fff; padding: 1.6mm; border-radius: 1.2mm; }
  .qr { display: block; width: 16mm; height: 16mm; }
  .cta { flex: 1; font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 1; letter-spacing: 0.2mm; }
  .cta small { display: block; font-size: 3.8mm; color: #BDB8CC; letter-spacing: 0.3mm; }
  .cta b { display: block; font-weight: 400; font-size: 7.4mm; color: var(--pink); margin-top: 0.8mm; }
  .cta .url { display: block; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 3.8mm; text-transform: none; letter-spacing: 0; margin-top: 1.2mm; }
  .logo { height: 17mm; flex: none; margin: -1mm 0; }

</style>
